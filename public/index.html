<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUM">
<title>HUM</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1320x2868.png">

<link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1260x2736.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1242x2688.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/1125x2436.png">

<link rel="stylesheet" href="/app.css?v=8">
<style>#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center}#splash svg{width:84px;height:84px;color:#f2f2f2;animation:sp 1.6s ease-in-out infinite}@keyframes sp{50%{transform:scale(.92);opacity:.7}}</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M10 24c2.3-5 4.7-5 7 0s4.7 5 7 0 4.7-5 7 0 4.7 5 7 0" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/></svg></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="hum" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="3.8"/><path d="M10 24c2.3-5 4.7-5 7 0s4.7 5 7 0 4.7-5 7 0 4.7 5 7 0" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 6.2c0-.8.9-1.3 1.6-.8l8.1 5.7c.6.4.6 1.4 0 1.8l-8.1 5.7c-.7.5-1.6 0-1.6-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 6.5C7 5.7 7.6 5 8.5 5S10 5.7 10 6.5v11c0 .8-.6 1.5-1.5 1.5S7 18.3 7 17.5zM14 6.5c0-.8.6-1.5 1.5-1.5s1.5.7 1.5 1.5v11c0 .8-.6 1.5-1.5 1.5S14 18.3 14 17.5z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5.5 7.4c0-.8.9-1.3 1.6-.8l6.5 4.6c.6.4.6 1.2 0 1.6l-6.5 4.6c-.7.5-1.6 0-1.6-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M18 6.5v11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18.5 7.4c0-.8-.9-1.3-1.6-.8l-6.5 4.6c-.6.4-.6 1.2 0 1.6l6.5 4.6c.7.5 1.6 0 1.6-.8z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M6 6.5v11" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.5c-5.5-3.5-8-6.7-8-9.9C4 7.2 5.8 5.5 8 5.5c1.6 0 3 .9 4 2.3 1-1.4 2.4-2.3 4-2.3 2.2 0 4 1.7 4 4.1 0 3.2-2.5 6.4-8 9.9z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 19.5c-5.5-3.5-8-6.7-8-9.9C4 7.2 5.8 5.5 8 5.5c1.6 0 3 .9 4 2.3 1-1.4 2.4-2.3 4-2.3 2.2 0 4 1.7 4 4.1 0 3.2-2.5 6.4-8 9.9z" fill="currentColor" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></symbol>
    <symbol id="i-dislike" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M6.8 17.2 17.2 6.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="m20 20-4.5-4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3M4 17h3c2 0 3-1.5 4-3M14 9.5c1-1.5 2-2.5 3-2.5h3M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M5 11V9.5A2.5 2.5 0 0 1 7.5 7H19l-3-3M19 13v1.5a2.5 2.5 0 0 1-2.5 2.5H5l3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M5 19.5c1.2-3.2 3.9-4.8 7-4.8s5.8 1.6 7 4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7.5h9M17 7.5h3M4 16.5h3M11 16.5h9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="15" cy="7.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="9" cy="16.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.9"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M5 6.5h14M5 11.5h14M5 16.5h8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M17 15v4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="15.6" cy="19.4" r="1.6" fill="currentColor"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <div class="brand"><svg class="logo"><use href="#hum"/></svg><span>HUM</span></div>
    <button class="ib" id="accountsBtn" aria-label="Аккаунты"><svg><use href="#i-user"/></svg></button>
  </header>

  <main id="pages">
    <section class="page" id="page-wave"></section>
    <section class="page" id="page-likes" hidden></section>
    <section class="page" id="page-search" hidden></section>
  </main>

  <div id="mini" class="mini" hidden>
    <button class="mini-hit" id="miniOpen" aria-label="Открыть плеер">
      <div class="cover sm" id="miniCover"></div>
      <div class="mini-text"><div class="t" id="miniTitle">—</div><div class="s" id="miniSub"></div></div>
    </button>
    <button class="cb" id="miniPlay" aria-label="Играть"><svg><use href="#i-play"/></svg></button>
    <button class="cb" id="miniNext" aria-label="Дальше"><svg><use href="#i-next"/></svg></button>
    <div class="mini-progress"><div id="miniBar"></div></div>
  </div>

  <nav class="tabs" id="tabs">
    <div class="tab-blob" id="tabBlob"></div>
    <button class="tab on" data-tab="wave"><svg><use href="#hum"/></svg><span>Эфир</span></button>
    <button class="tab" data-tab="likes"><svg><use href="#i-heart"/></svg><span>Любимое</span></button>
    <button class="tab" data-tab="search"><svg><use href="#i-search"/></svg><span>Поиск</span></button>
  </nav>
</div>

<!-- full-screen player: smoked glass over light from the cover -->
<section id="player" class="player" hidden>
  <div class="pl-bg" aria-hidden="true">
    <div class="glow g1" id="glow1"></div>
    <div class="glow g2" id="glow2"></div>
    <div class="smoke"></div>
  </div>
  <div class="pl-in" id="plIn">
    <div class="pl-top">
      <button class="ib ghost" id="plClose" aria-label="Свернуть"><svg><use href="#i-down"/></svg></button>
      <div class="pl-ctx" id="plCtx"></div>
      <button class="ib ghost" id="lyricsBtn" aria-label="Текст песни"><svg><use href="#i-lyrics"/></svg></button>
    </div>
    <div class="pl-stage" id="plStage">
      <canvas id="plRings"></canvas>
      <div class="pl-cover" id="plCover"><div class="cv a" id="cvA"></div><div class="cv b" id="cvB"></div></div>
      <div class="lyrics" id="lyrics" hidden><div class="lyrics-in" id="lyricsIn"></div></div>
    </div>
    <div class="pl-meta">
      <div class="pl-titles" id="plTitles"><div class="t" id="plTitle">—</div><div class="s" id="plArtist"></div></div>
      <button class="cb" id="plLike" aria-label="Нравится"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="pl-tags" id="plTags"></div>
    <div class="seek">
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
      <div class="times"><span id="tPos">0:00</span><span id="tDur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="cb" id="plLeft" aria-label="Не нравится"><svg><use href="#i-dislike"/></svg></button>
      <button class="cb big" id="plPrev" aria-label="Назад"><svg><use href="#i-prev"/></svg></button>
      <button class="play" id="plPlay" aria-label="Играть"><svg><use href="#i-play"/></svg></button>
      <button class="cb big" id="plNext" aria-label="Дальше"><svg><use href="#i-next"/></svg></button>
      <button class="cb" id="plRepeat" aria-label="Повтор трека"><svg><use href="#i-repeat"/></svg></button>
    </div>
    <button class="vibe" id="plVibe">
      <span class="vibe-ic"><svg><use href="#hum"/></svg></span>
      <span class="vibe-t"><b>Эфир по вайбу</b><span id="vibeSub">Похожее по звучанию</span></span>
      <span class="vibe-go">Запустить</span>
    </button>
  </div>
</section>

<!-- artist page (Yandex) -->
<section id="artist" class="artist-page" hidden>
  <div class="ar-scroll" id="arScroll">
    <div class="ar-hero">
      <div class="ar-bg" id="arBg"></div>
      <div class="ar-name" id="arName"></div>
      <div class="ar-sub" id="arSub"></div>
      <div class="ar-actions">
        <button class="btn" id="arPlay"><svg><use href="#i-play"/></svg>Слушать</button>
        <button class="btn sec" id="arWave"><svg><use href="#hum"/></svg>Эфир по артисту</button>
      </div>
    </div>
    <div class="ar-body">
      <div class="h">Популярные треки</div>
      <div class="rows" id="arPopular"></div>
      <div class="h" id="arAllH" hidden>Все треки</div>
      <div class="rows" id="arAll"></div>
    </div>
  </div>
  <button class="ib ar-back" id="arBack" aria-label="Назад"><svg><use href="#i-down"/></svg></button>
</section>

<!-- bottom sheets: wave settings, accounts -->
<div id="scrim" class="scrim" hidden></div>
<section id="tune" class="bsheet" hidden>
  <div class="grab"></div>
  <div class="bs-head"><span>Настройки эфира</span><button class="ib ghost" data-close aria-label="Закрыть"><svg><use href="#i-down"/></svg></button></div>
  <div class="bs-body" id="tuneBody"></div>
</section>
<section id="accounts" class="bsheet" hidden>
  <div class="grab"></div>
  <div class="bs-head"><span>Аккаунты</span><button class="ib ghost" data-close aria-label="Закрыть"><svg><use href="#i-down"/></svg></button></div>
  <div class="bs-body" id="accountsBody"></div>
</section>

<div id="toast" class="toast"></div>
<audio id="audio" preload="auto" playsinline></audio>
<script type="module" src="/app.js?v=8"></script>
</body>
</html>
